<!-- src/main/resources/templates/fragments/sidebar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="sidebar" id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
  <div class="position-sticky pt-3 sidebar-sticky">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/dashboard') ? 'active' : ''}" href="/dashboard">
          <i class="bi bi-house"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/projects') ? 'active' : ''}" href="/projects">
          <i class="bi bi-folder"></i> Projects
        </a>
      </li>
      <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
        <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/users') ? 'active' : ''}" href="/users">
          <i class="bi bi-people"></i> Users
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/reports') ? 'active' : ''}" href="/reports">
          <i class="bi bi-bar-chart"></i> Reports
        </a>
      </li>
    </ul>

    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
      <span>Guides</span>
    </h6>
    <ul class="nav flex-column mb-2">
      <li class="nav-item">
        <a class="nav-link" href="/guides/excel">
          <i class="bi bi-file-earmark-spreadsheet"></i> Excel Integration
        </a>
      </li>
    </ul>
  </div>
</nav>
</body>
</html>
