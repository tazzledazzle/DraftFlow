<!-- src/main/resources/templates/projects/view.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<header th:replace="fragments/header :: navbar"></header>

<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/sidebar :: sidebar"></nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2" th:text="${project.name}"></h1>
        <div class="btn-toolbar mb-2 mb-md-0">
          <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-pencil"></i> Edit Project
          </a>
          <a th:href="@{/projects/{id}/excel-token(id=${project.id})}" class="btn btn-sm btn-outline-success">
            <i class="bi bi-file-earmark-spreadsheet"></i> Excel Integration
          </a>
        </div>
      </div>

      <div th:replace="fragments/header :: alert"></div>

      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">
              Project Details
            </div>
            <div class="card-body">
              <dl class="row">
                <dt class="col-sm-4">Description:</dt>
                <dd class="col-sm-8" th:text="${project.description ?: 'None'}"></dd>

                <dt class="col-sm-4">Start Date:</dt>
                <dd class="col-sm-8" th:text="${project.startDate ?: 'Not set'}"></dd>

                <dt class="col-sm-4">End Date:</dt>
                <dd class="col-sm-8" th:text="${project.endDate ?: 'Not set'}"></dd>

                <dt class="col-sm-4">Created:</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(project.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
              </dl>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h2 class="h3">Tasks</h2>
        <div class="btn-toolbar mb-2 mb-md-0">
          <a th:href="@{/projects/{id}/tasks/create(id=${project.id})}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-plus"></i> Add Task
          </a>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Estimated Hours</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="task : ${tasks}">
            <td th:text="${task.name}"></td>
            <td th:text="${task.description ?: 'None'}"></td>
            <td th:text="${task.estimatedHours ?: 'Not set'}"></td>
            <td>
              <a th:href="@{/projects/{projectId}/tasks/{taskId}/edit(projectId=${project.id},taskId=${task.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i>
              </a>
              <button type="button" class="btn btn-sm btn-outline-danger"
                      data-bs-toggle="modal"
                      th:data-bs-target="'#deleteTaskModal' + ${task.id}">
                <i class="bi bi-trash"></i>
              </button>

              <!-- Delete Confirmation Modal -->
              <div class="modal fade" th:id="'deleteTaskModal' + ${task.id}" tabindex="-1">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">Confirm Delete</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <p>Are you sure you want to delete this task? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <form th:action="@{/projects/{projectId}/tasks/{taskId}/delete(projectId=${project.id},taskId=${task.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Delete</button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </td>
          </tr>
          <tr th:if="${tasks == null}">
            <td colspan="4" class="text-center">No tasks found</td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/footer :: scripts"></div>
</body>
</html>
