<!-- src/main/resources/templates/projects/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: head"></head>
<body>
<header th:replace="fragments/header :: navbar"></header>

<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/sidebar :: sidebar"></nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Projects</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
          <a href="/projects/create" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-plus"></i> New Project
          </a>
        </div>
      </div>

      <div th:replace="fragments/header :: alert"></div>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
          <tr>
            <th>Name</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Tasks</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="project : ${projects}">
            <td>
              <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a>
            </td>
            <td th:text="${project.startDate}"></td>
            <td th:text="${project.endDate}"></td>
            <td th:text="${project.taskCount}"></td>
            <td>
              <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/projects/{id}/excel-token(id=${project.id})}" class="btn btn-sm btn-outline-success">
                <i class="bi bi-file-earmark-spreadsheet"></i>
              </a>
              <button type="button" class="btn btn-sm btn-outline-danger"
                      data-bs-toggle="modal"
                      th:data-bs-target="'#deleteModal' + ${project.id}">
                <i class="bi bi-trash"></i>
              </button>

              <!-- Delete Confirmation Modal -->
              <div class="modal fade" th:id="'deleteModal' + ${project.id}" tabindex="-1">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title">Confirm Delete</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <p>Are you sure you want to delete this project? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Delete</button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </td>
          </tr>
          <tr th:if="${projects.empty}">
            <td colspan="5" class="text-center">No projects found</td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/footer :: scripts"></div>
</body>
</html>
