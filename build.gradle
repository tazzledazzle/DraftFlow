plugins {
    id 'org.springframework.boot' version '3.4.3'
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
}

group = 'com.northshore'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web:3.4.3')
    implementation('org.springframework.boot:spring-boot-starter-validation:3.4.3')
    implementation('org.springframework.boot:spring-boot-starter-actuator:3.4.3')
    // thymeleaf web views
    implementation('org.springframework.boot:spring-boot-starter-thymeleaf:3.4.3')
    implementation('org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.3.RELEASE')
    // Database
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:3.4.3")
    implementation('org.postgresql:postgresql:42.7.2')
    implementation("org.flywaydb:flyway-core:9.21.0")
    // Security
    implementation("org.springframework.boot:spring-boot-starter-security:3.4.3")
    implementation("io.jsonwebtoken:jjwt-api:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.11.5")

    // API Documentation
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0")

    // Kotlin
    implementation("org.jetbrains.kotlin:kotlin-reflect:2.1.10")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.10")
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2")

    // Utilities
    implementation("org.apache.commons:commons-lang3:3.12.0")
    implementation("org.apache.commons:commons-csv:1.10.0")
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.6") // For caching

    // Logging
    implementation("io.github.microutils:kotlin-logging-jvm:3.0.5")

    // Development
    developmentOnly("org.springframework.boot:spring-boot-devtools:3.4.3")

    // Test dependencies
    testImplementation("org.springframework.boot:spring-boot-starter-test:3.4.3")
    testImplementation("org.springframework.security:spring-security-test:6.1.3")
    testImplementation("org.mockito.kotlin:mockito-kotlin:5.0.0")
    testImplementation("org.mockito:mockito-inline:5.2.0")
    testImplementation("org.assertj:assertj-core:3.24.2")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.3")
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.9.3")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.3")
    testImplementation("com.h2database:h2:2.2.220") // In-memory database for testing
    testImplementation("org.testcontainers:postgresql:1.19.1") // For integration tests with real PostgreSQL
    testImplementation("org.testcontainers:junit-jupiter:1.18.3")
    testImplementation("io.kotest:kotest-runner-junit5-jvm:5.9.0")
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

test {
    useJUnitPlatform()

}

// JPA/Hibernate annotations
allOpen {
    annotation("javax.persistence.Entity")
    annotation("javax.persistence.Embeddable")
    annotation("javax.persistence.MappedSuperclass")
}
noArg {
    annotation("jakarta.persistence.Entity")
    annotation("jakarta.persistence.MappedSuperclass")
    annotation("jakarta.persistence.Embeddable")
}

//TODO("make sure this dependency exists")
//tasks.bootJar {
//    archiveFileName.set("northshore-timesheet-app.jar")
//    mainClass = "App"
//}
tasks.bootJar {
    mainClass = "App"
}

plugins.apply("jacoco")
tasks.named("jacocoTestReport") {
    dependsOn(tasks.test)
    reports {
        xml.enabled = true
        html.enabled = true
    }
}